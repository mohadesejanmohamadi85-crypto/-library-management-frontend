<!DOCTYPE html>
<html lang="fa"dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد دانشجو - سیستم مدیریت کتابخانه</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="./dashboard.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">📚 مدیریت کتابخانه</div>
                <nav class="nav">
                    <a href="dashboard.html" class="active">داشبورد</a>
                    <a href="books.html">کتاب ها</a>
                    <a href="my-loans.html">امانت های من</a>
                    <a href="login.html" id="logoutBtn">خروج</a>
                </nav>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">م</div>
                    <span id="userName" class="user-Name">دانشجو</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <h1>خوش برگشتی ,<span id="studentName">دانشجو</span>!</h1>
            <p style="color:rgba(0, 0, 0, 0.493); margin-bottom: 2rem; font-weight: 650; font-size: 20px;">حساب کتابخانه‌ت رو مدیریت کن و مجموعه‌مون رو بگرد</p>
            <!-- Statistics Cards -->
            <div class="grid grid-2">
                <div class="card stat-card">
                    <div class="stat-number" id="activeLoans">0</div>
                    <div class="stat-label">امانت های فعال</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-number" id="availableBooks">0</div>
                    <div class="stat-label">کتاب های موجود</div>
                </div>
            </div>
            <!-- Quick Actions -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">دسترسی سریع</h2>
                </div>
                <div class="grid grid-2">
                    <a href="books.html" class="btn btn-primary" style="text-align: center; padding: 2rem;">
                        <h3>📖 مشاهده کتاب ها</h3>
                        <p class="text-space">مجموعه‌مون رو بگرد و کتاب بعدیت رو پیدا کن</p>
                    </a>
                    <a href="my-loans.html" class="btn btn-success" style="text-align: center; padding: 2rem;">
                        <h3>📋 امانت‌های من</h3>
                        <p class="text-space">امانت‌های فعلیت رو ببین و مدیریت کن</p>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
