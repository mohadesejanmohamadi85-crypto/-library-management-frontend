<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم مدیریت کتابخانه</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="./tamrin.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">📚 سیستم مدیریت کتابخانه</h1>
            <div id="alert-container"></div>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">ایمیل</label>
                    <input type="email" id="email" class="form-input" placeholder="ایمیل خود را وارد کنید" >
                    <div id="emailError" class="errorMessage"></div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">رمز عبور</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور خود را وارد کنید" >
                    <div id="passwordError" class="errorMessage"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span id="loginText" style="font-size: 20px;">ورود</span>
                    <span id="loginSpinner" class="loading hidden"></span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
