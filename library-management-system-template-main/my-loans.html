<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امانت‌های من - سیستم مدیریت کتابخانه</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="./js/my-loans.js" defer></script>
</head>
<body> 
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">📚 مدیریت کتابخانه</div>
                <nav class="nav">
                    <a href="dashboard.html">داشبورد</a>
                    <a href="books.html">کتاب ها</a>
                    <a href="my-loans.html" class="active">امانت های من</a>
                    <a href="login.html">خروج</a>
                </nav>
                <div class="user-info">
                    <div class="user-avatar">م</div>
                    <span id="firstName" class="user-Name">دانشجو</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <h1>امانت های من</h1>
            <p style="color: #2b2828; margin-bottom: 1.5rem; font-size: 18px;">کتاب‌های امانت گرفته شده خود را مشاهده و مدیریت کنید.</p>
            <!-- Loans Table -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">لیست امانت‌ها</h2>
                    <span style="color: #666;font-weight: 700; font-size: 20px;"class="loanSummaryText">مجموع: ۳ امانت</span>
                </div>
                
                <table class="table">
                    <thead>
                        <tr>
                            <th class="table-th">عنوان کتاب</th>
                            <th class="table-th">نویسنده</th>
                            <th class="table-th">تاریخ امانت</th>
                            <th class="table-th">وضعیت</th>
                            <th class="table-th">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                    </tbody>
                </table>
            </div>
            <!-- Loan Statistics -->
            <div class="grid grid-2">
                <div class="card stat-card">
                    <div class="stat-number" id="activeLoansCount">2</div>
                    <div class="stat-label ">امانت‌های فعال</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-number" id="returnedLoansCount">1</div>
                    <div class="stat-label">کتاب‌های بازگردانده شده</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
